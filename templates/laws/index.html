<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>متون قوانین - دادرس</title>
  <style>
    body { margin:0; background:#0b0f14; color:#e2e8f0; font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
    .wrap { max-width:980px; margin: 16px auto; padding: 12px }
    .panel { background:#0f141b; border:1px solid #1f2937; border-radius:12px; padding:12px }
    .muted { color:#94a3b8 }
    input { width:100%; padding:12px 14px; background:#0b1220; color:#e2e8f0; border:1px solid #1f2937; border-radius:10px }
    .btn { padding:10px 14px; background:#22c55e; color:#03120a; border:0; border-radius:10px; cursor:pointer }
    table { width:100%; border-collapse: collapse; }
    th, td { border:1px solid #1f2937; padding:8px; text-align:right }
    th { color:#94a3b8; background:#0b1220 }
  </style>
  <script>
    async function fetchJson(url){ const r = await fetch(url); return await r.json(); }
    async function loadList(){
      const j = await fetchJson('/laws/list');
      const tbody = document.getElementById('lawBody');
      tbody.innerHTML = '';
      (j.items||[]).forEach(it=>{
        const tr = document.createElement('tr');
        const a = document.createElement('a'); a.href='#'; a.textContent=it.file; a.addEventListener('click', ev=>{ ev.preventDefault(); showFile(it.file); });
        const tdF=document.createElement('td'); tdF.appendChild(a);
        const tdA=document.createElement('td'); tdA.textContent = it.articles;
        const tdS=document.createElement('td'); tdS.textContent = (it.size||0)+' بایت';
        tr.appendChild(tdF); tr.appendChild(tdA); tr.appendChild(tdS); tbody.appendChild(tr);
      });
    }
    async function doSearch(){
      const q = document.getElementById('q').value.trim();
      const j = await fetchJson('/laws/search?q='+encodeURIComponent(q));
      const out = document.getElementById('results'); out.innerHTML='';
      (j.items||[]).forEach(it=>{
        const div = document.createElement('div'); div.className='panel'; div.style.marginTop='10px';
        if(it.type==='article'){
          const a = document.createElement('a'); a.href='#'; a.textContent = `${it.file} • ماده ${it.num}`; a.addEventListener('click', ev=>{ ev.preventDefault(); showArticle(it.file, it.num); });
          const p = document.createElement('div'); p.className='muted'; p.textContent = it.snippet;
          div.appendChild(a); div.appendChild(p);
        }else{
          const a = document.createElement('a'); a.href='#'; a.textContent = `${it.file} • نتیجه`; a.addEventListener('click', ev=>{ ev.preventDefault(); showFile(it.file); });
          const p = document.createElement('div'); p.className='muted'; p.textContent = it.snippet;
          div.appendChild(a); div.appendChild(p);
        }
        out.appendChild(div);
      });
    }
    async function showArticle(file, num){
      const j = await fetchJson('/laws/article?file='+encodeURIComponent(file)+'&num='+encodeURIComponent(num));
      const out = document.getElementById('viewer'); out.innerHTML='';
      if(!j.ok){ out.textContent='یافت نشد'; return; }
      const h = document.createElement('h3'); h.textContent = `${file} • ماده ${num}`;
      const p = document.createElement('div'); p.className='panel'; p.textContent = j.text;
      out.appendChild(h); out.appendChild(p);
    }
    async function showFile(file){
      const j = await fetchJson('/laws/search?q='+encodeURIComponent(file));
      const out = document.getElementById('viewer'); out.innerHTML='';
      const h = document.createElement('h3'); h.textContent = file;
      out.appendChild(h);
    }
    document.addEventListener('DOMContentLoaded', ()=>{ loadList(); document.getElementById('btnSearch').addEventListener('click', doSearch); });
  </script>
</head>
<body>
  <div class="wrap">
    <div class="panel">
      <h2>قوانین بارگذاری‌شده</h2>
      <div style="display:flex; gap:8px; align-items:center; margin:10px 0;">
        <input id="q" placeholder="جستجو در قوانین... (مثلاً ماده 1 یا کلمه کلیدی)">
        <button id="btnSearch" class="btn">جستجو</button>
      </div>
      <div style="overflow:auto">
        <table>
          <thead><tr><th>فایل</th><th>مواد</th><th>حجم</th></tr></thead>
          <tbody id="lawBody"></tbody>
        </table>
      </div>
    </div>
    <div id="results"></div>
    <div id="viewer" style="margin-top:12px"></div>
  </div>
</body>
</html>
