<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>طرح‌ها - دادرس</title>
  <style>
    :root { --bg:#0b1220; --panel:rgba(15,23,42,0.6); --panel-border:rgba(51,65,85,0.6); --text:#e2e8f0; --muted:#94a3b8; --radius-lg:16px; --radius-sm:12px; font-family:'Vazirmatn',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif; }
    *{ box-sizing:border-box; }
    body{ margin:0; min-height:100vh; background:var(--bg); color:var(--text); display:flex; justify-content:center; }
    a{ color:inherit; text-decoration:none; }
    .layout{ width:100%; max-width:860px; padding:24px 16px 64px; display:flex; flex-direction:column; gap:16px; }
    .topbar{ display:grid; grid-template-columns:1fr auto 1fr; align-items:center; padding:12px 14px; border:1px solid var(--panel-border); border-radius:var(--radius-lg); background:rgba(11,17,27,0.5); }
    .brand{ grid-column:2; display:flex; align-items:center; justify-content:center; }
    .logo{ width:28px; height:28px; display:flex; align-items:center; justify-content:center; border-radius:8px; }
    .left{ grid-column:1; justify-self:start; }
    .ghost{ padding:8px 14px; border-radius:10px; border:1px solid var(--panel-border); background:rgba(11,17,27,0.6); font-size:13px; }
    .card{ padding:18px; border:1px solid var(--panel-border); border-radius:var(--radius-lg); background:rgba(11,17,27,0.5); display:flex; flex-direction:column; gap:10px; }
    .row{ display:flex; gap:10px; flex-wrap:wrap; }
    .chip{ display:inline-flex; gap:6px; align-items:center; padding:4px 10px; border:1px solid var(--panel-border); border-radius:999px; font-size:12px; color:var(--muted); background:rgba(15,23,42,0.5); }
  </style>
</head>
<body>
  <div class="layout">
    <header class="topbar">
      <div class="left"><a class="ghost" href="/">بازگشت</a></div>
      <div class="brand"><div class="logo" title="قوه قضائیه" aria-label="قوه قضائیه">⚖️</div></div>
      <div></div>
    </header>
    <section class="card">
      <div style="font-weight:700; font-size:16px;">طرح شما</div>
      <div class="row">
        <div class="chip">طرح فعال: <span id="planTitle">رایگان</span></div>
        <div class="chip">شناسه دستگاه: <span id="deviceId">—</span></div>
      </div>
      <div style="color:var(--muted); font-size:12px;">فعلاً فقط طرح رایگان فعال است. امکانات ارتقا به‌زودی.</div>
    </section>
  </div>
  <script>
    (function(){
      const u = {{ (current_user or {}) | tojson }};
      const planMap = { free:'رایگان', plus:'پلاس', pro:'حرفه‌ای', team:'سازمانی' };
      const masked = (u.id||'').toString().replace(/^(..).*(..)$/, '$1••••$2');
      const planEl = document.getElementById('planTitle');
      const devEl = document.getElementById('deviceId');
      if(planEl) planEl.textContent = planMap[u.plan] || planMap.free;
      if(devEl) devEl.textContent = masked || '—';
    })();
  </script>
</body>
</html>
