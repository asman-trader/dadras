<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>پروفایل - دادرس</title>
  <style>
    body { margin:0; background:#0b0f14; color:#e2e8f0; font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
    .wrap { max-width:720px; margin: 20px auto; padding: 16px }
    .card { background:#0f141b; border:1px solid #1f2937; border-radius:12px; padding:16px; display:flex; gap:16px; align-items:center }
    .avatar { width:56px; height:56px; border-radius:50%; background:linear-gradient(135deg,#3b82f6,#22c55e); display:flex; align-items:center; justify-content:center; font-weight:700; color:#05101c; font-size:24px }
    .meta { display:flex; flex-direction:column; gap:6px }
    .muted { color:#94a3b8 }
    .btn { padding:10px 14px; background:#22c55e; color:#03120a; border:0; border-radius:10px; cursor:pointer }
    .btn.secondary { background:#0b1220; color:#e2e8f0; border:1px solid #1f2937 }
    .grid { display:grid; gap:12px; grid-template-columns: 1fr 1fr }
    @media (max-width: 600px){ .grid { grid-template-columns: 1fr } }
    input { width:100%; padding:12px 14px; background:#0b1220; color:#e2e8f0; border:1px solid #1f2937; border-radius:10px }
    label { font-size:12px; color:#94a3b8 }
    table { width:100%; border-collapse: collapse; }
    th, td { border:1px solid #1f2937; padding:8px; text-align:right }
    th { color:#94a3b8; background:#0b1220 }
  </style>
  <script>
    document.addEventListener('DOMContentLoaded', async ()=>{
      try{
        const r = await fetch('/auth/me');
        const j = await r.json();
        if(!j.authenticated){ window.location.href = '/auth/login'; return; }
        const u = j.user||{};
        const phone = u.phone || '';
        const phoneLocal = phone && phone.startsWith('98') ? ('0' + phone.slice(2)) : phone;
        document.getElementById('phone').value = phoneLocal || '';
        document.getElementById('first_name').value = u.first_name || '';
        document.getElementById('last_name').value = u.last_name || '';
        const roleMap = { 'citizen': 'شهروند', 'lawyer': 'وکیل', 'judge': 'قاضی' };
        document.getElementById('role').value = roleMap[u.role] || roleMap['citizen'];
      }catch(e){}

      // load downloadable files
      try{
        const r2 = await fetch('/auth/files');
        const j2 = await r2.json();
        const tbody = document.getElementById('filesBody');
        tbody.innerHTML = '';
        (j2.items||[]).forEach(it=>{
          const tr = document.createElement('tr');
          const a = document.createElement('a');
          a.href = '/draft/download?file='+encodeURIComponent(it.name);
          a.textContent = it.name;
          a.setAttribute('download', it.name);
          const tdName = document.createElement('td'); tdName.appendChild(a);
          const tdSize = document.createElement('td'); tdSize.textContent = (it.size||0)+' بایت';
          const tdTime = document.createElement('td'); tdTime.textContent = new Date((it.mtime||0)*1000).toLocaleString('fa-IR');
          tr.appendChild(tdName); tr.appendChild(tdSize); tr.appendChild(tdTime);
          tbody.appendChild(tr);
        });
      }catch(e){}
    });
  </script>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <div class="avatar">👤</div>
      <div class="meta" style="flex:1">
        <div>پروفایل کاربر</div>
        <div class="muted">تنظیمات و اطلاعات ورود</div>
      </div>
      <a class="btn secondary" href="/">بازگشت</a>
    </div>

    <div class="card" style="margin-top:12px; display:block">
      <div class="grid">
        <div>
          <label>شماره موبایل</label>
          <input id="phone" disabled>
        </div>
        <div>
          <label>وضعیت</label>
          <input value="وارد شده" disabled>
        </div>
        <div>
          <label>نام</label>
          <input id="first_name" disabled>
        </div>
        <div>
          <label>نام خانوادگی</label>
          <input id="last_name" disabled>
        </div>
        <div>
          <label>پنل</label>
          <input id="role" disabled>
        </div>
      </div>
      <div style="margin-top:12px; display:flex; gap:8px;">
        <a class="btn secondary" href="/auth/logout">خروج</a>
        <a class="btn" href="/">رفتن به خانه</a>
      </div>
    </div>

    <div class="card" style="margin-top:12px; display:block">
      <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:10px">
        <div>فایل‌های ساخته‌شده</div>
        <a class="btn secondary" href="/">ادامه گفتگو</a>
      </div>
      <div style="overflow:auto">
        <table>
          <thead>
            <tr>
              <th>نام فایل</th>
              <th>حجم</th>
              <th>آخرین تغییر</th>
            </tr>
          </thead>
          <tbody id="filesBody"></tbody>
        </table>
      </div>
    </div>
  </div>
</body>
</html>
