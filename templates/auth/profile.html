<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>پروفایل - دادرس</title>
  <style>
    :root {
      --bg: #0b1220;
      --panel: rgba(15,23,42,0.6);
      --panel-border: rgba(51,65,85,0.6);
      --text: #e2e8f0;
      --muted: #94a3b8;
      --radius-lg: 16px;
      --radius-sm: 12px;
      font-family: 'Vazirmatn', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--text); display:flex; justify-content:center; }
    a { color: inherit; text-decoration: none; }
    .layout { width:100%; max-width: 860px; padding: 24px 16px 64px; display:flex; flex-direction:column; gap: 16px; }
    .topbar { display:grid; grid-template-columns: 1fr auto 1fr; align-items:center; padding: 12px 14px; border-radius: var(--radius-lg); border: 1px solid var(--panel-border); background: rgba(11,17,27,0.5); }
    .topbar .brand { grid-column: 2; display:flex; align-items:center; justify-content:center; gap:10px; }
    .logo { width: 28px; height: 28px; display:flex; align-items:center; justify-content:center; border-radius: 8px; }
    .top-actions { grid-column: 1 / span 1; justify-self:start; display:flex; gap:8px; }
    .ghost { padding: 8px 14px; border-radius: 10px; border: 1px solid var(--panel-border); background: rgba(11,17,27,0.6); font-size: 13px; }
    .profile-card { display:flex; gap:16px; align-items:center; padding: 18px; border:1px solid var(--panel-border); border-radius: var(--radius-lg); background: rgba(11,17,27,0.5); }
    .profile-avatar { width: 56px; height:56px; border-radius: 12px; display:flex; align-items:center; justify-content:center; font-size: 24px; background: rgba(30,41,59,0.7); }
    .profile-meta { display:flex; flex-direction:column; gap:8px; }
    .profile-meta h1 { margin:0; font-size:18px; font-weight:700; }
    .sub { display:flex; gap:12px; flex-wrap:wrap; color: var(--muted); font-size:12px; }
    .chip { display:inline-flex; gap:6px; align-items:center; padding:4px 10px; border:1px solid var(--panel-border); border-radius:999px; font-size:12px; background: rgba(15,23,42,0.5); }
    .info-grid { display:grid; grid-template-columns: repeat(auto-fit, minmax(220px,1fr)); gap:12px; }
    .info-card { padding:14px; border:1px solid var(--panel-border); border-radius: var(--radius-sm); background: rgba(11,17,27,0.5); display:flex; flex-direction:column; gap:10px; }
    .info-card .value { font-size:16px; font-weight:600; }
    @media (min-width: 720px){ .layout{ padding:28px 18px 72px;} }
  </style>
  <script>
    document.addEventListener('DOMContentLoaded', ()=>{
      const u = {{ (current_user or {}) | tojson }};
      const setText = (id, v)=>{ const el=document.getElementById(id); if(el) el.textContent = (v&&v!=='undefined')? v : '—'; };
      const planMap = { 'free':'رایگان','plus':'پلاس','pro':'حرفه‌ای','team':'سازمانی' };
      const roleMap = { 'citizen':'شهروند','lawyer':'وکیل','judge':'قاضی' };
      const maskedId = (u.id||'').toString().replace(/^(..).*(..)$/, '$1••••$2');
      setText('profileAvatar', '👤');
      setText('profileName', 'کاربر دستگاه');
      setText('profileDeviceId', maskedId || '—');
      setText('profileRole', roleMap[u.role] || roleMap['citizen']);
      setText('profilePlan', planMap[u.plan] || planMap['free']);
      const badge = document.getElementById('profilePlanBadge'); if(badge){ badge.textContent = planMap[u.plan] || planMap['free']; }
    });
  </script>
</head>
<body>
  <main class="layout">
    <header class="topbar">
      <div class="top-actions">
        <a class="ghost" href="/">بازگشت</a>
      </div>
      <div class="brand"><div class="logo" title="قوه قضائیه" aria-label="قوه قضائیه">⚖️</div></div>
      <div></div>
    </header>

    <section class="profile-card">
      <div class="profile-avatar" id="profileAvatar">👤</div>
      <div class="profile-meta">
        <h1 id="profileName">کاربر دستگاه</h1>
        <div class="sub">
          <span>🎫 <span id="profileRole">—</span></span>
          <span class="chip" id="profilePlanBadge"></span>
        </div>
      </div>
    </section>

    <section class="info-grid">
      <div class="info-card">
        <header><span>شناسه دستگاه</span><span>🆔</span></header>
        <div class="value" id="profileDeviceId">—</div>
        <div class="meta">این شناسه بر اساس IP و مرورگر شما ساخته شده و برای ذخیره گفتگوها استفاده می‌شود.</div>
      </div>
      <div class="info-card">
        <header><span>طرح فعال</span><span>⭐</span></header>
        <div class="value" id="profilePlan">رایگان</div>
        <div class="meta">برای امکانات بیشتر بعداً می‌توان بخش طرح‌ها را فعال کرد.</div>
      </div>
    </section>

    
  </main>
</body>
</html>
