    // Templates dropdown
    const btnTemplates = document.getElementById('btnTemplates');
    const templatesMenu = document.getElementById('templatesMenu');
    
    btnTemplates?.addEventListener('click', (e)=>{
      e.stopPropagation();
      templatesMenu.classList.toggle('open');
    });
    
    document.addEventListener('click', (e)=>{
      if(!templatesMenu?.contains(e.target) && e.target !== btnTemplates){
        templatesMenu?.classList.remove('open');
      }
    });
    
    // Handle template selection
    document.querySelectorAll('.template-option').forEach(option=>{
      option.addEventListener('click', async ()=>{
        const templateType = option.dataset.template;
        const template = legalTemplates[templateType];
        
        if(template && typeof openNoteEditor === 'function'){
          templatesMenu.classList.remove('open');
          // Create note with template
          openNoteEditor('', template.title, template.content);
        }
      });
    });

    // auto refresh
    let notesAutoTimer = null;
    function startNotesAuto(){
      if(notesAutoTimer) clearInterval(notesAutoTimer);
      notesAutoTimer = setInterval(()=>{
        try{
          if(typeof refreshNotesList === 'function'){ refreshNotesList(); toggleEmptyState(); }
        }catch(e){}
      }, 10000);
    }
    document.addEventListener('visibilitychange', ()=>{ if(!document.hidden){ startNotesAuto(); } });

    // search filter
    const search = document.getElementById('notesSearch');
    function filterNotes(){
      try{
        const q = (search.value||'').trim().toLowerCase();
        const list = document.getElementById('notesList');
        Array.from(list.children||[]).forEach(row=>{
          const text = (row.textContent||'').trim().toLowerCase();
          row.style.display = (!q || text.includes(q)) ? '' : 'none';
        });
        toggleEmptyState();
      }catch(e){}
    }
    search?.addEventListener('input', filterNotes);

    // empty state toggler
    function toggleEmptyState(){
      const list = document.getElementById('notesList');
      const empty = document.getElementById('notesEmpty');
      if(!list || !empty) return;
      const hasAny = Array.from(list.children||[]).some(el=> el.style.display !== 'none');
      empty.style.display = hasAny ? 'none' : '';
    }

    // init
    startNotesAuto();
    setTimeout(()=>{ toggleEmptyState(); }, 0);
    
    // Update notes badge count
    function updateNotesBadge(){
      try{
        const list = document.getElementById('notesList');
        const badge = document.getElementById('notesBadge');
        if(!badge) return;
        const count = list?.children?.length || 0;
        if(count > 0){
          badge.textContent = count;
          badge.style.display = '';
        } else {
          badge.style.display = 'none';
        }
      }catch(e){}
    }
    
    // Update badge whenever notes list changes
    const notesList = document.getElementById('notesList');
    if(notesList){
      const observer = new MutationObserver(updateNotesBadge);
      observer.observe(notesList, { childList: true });
    }
    
    // Initial update
    setTimeout(updateNotesBadge, 100);
  })();

  // Delete Modal Functions
  let noteToDelete = null;

  function openDeleteNoteModal(noteId, noteTitle, noteContent) {
    noteToDelete = noteId;
    document.getElementById('deleteNoteTitle').textContent = noteTitle || 'بدون عنوان';
    document.getElementById('deleteNotePreview').textContent = noteContent || 'بدون متن';
    document.getElementById('deleteNoteModal').style.display = 'flex';
    document.body.style.overflow = 'hidden';
  }

  function closeDeleteNoteModal() {
    noteToDelete = null;
    document.getElementById('deleteNoteModal').style.display = 'none';
    document.body.style.overflow = '';
  }

  // Confirm Delete
  document.getElementById('confirmDeleteNote')?.addEventListener('click', async function() {
    if (!noteToDelete) return;
    
    try {
      const res = await fetch(`/notes/${noteToDelete}`, { method: 'DELETE' });
      if (res.ok) {
        closeDeleteNoteModal();
        // Refresh the notes list
        if (typeof refreshNotesList === 'function') {
          refreshNotesList();
        }
        // Show success message if available
        if (typeof showToast === 'function') {
          showToast('یادداشت با موفقیت حذف شد', 'success');
        }
      } else {
        const err = await res.json();
        if (typeof showToast === 'function') {
          showToast(err.error || 'خطا در حذف یادداشت', 'error');
        } else {
          alert(err.error || 'خطا در حذف یادداشت');
        }
      }
    } catch (err) {
      console.error('Delete note error:', err);
      if (typeof showToast === 'function') {
        showToast('خطا در ارتباط با سرور', 'error');
      } else {
        alert('خطا در ارتباط با سرور');
      }
    }
  });

  // Close modal on Escape key
  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape' && document.getElementById('deleteNoteModal').style.display === 'flex') {
      closeDeleteNoteModal();
    }
  });
  </script>
