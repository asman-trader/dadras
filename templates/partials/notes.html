<aside id="notesSidebar" class="panel" aria-label="دفترچه یادداشت" style="display:flex; flex-direction:column; gap:10px;">
  <details id="notesBox" open>
    <summary style="display:flex; align-items:center; gap:10px; cursor:pointer; padding:6px 8px; border-bottom:1px solid var(--border);">
      <strong style="display:flex; align-items:center; gap:8px;">🗒️ یادداشت‌ها</strong>
      <span class="muted" id="notesCount" style="font-size:11px; margin-inline-start:auto"></span>
      <div style="display:flex; gap:6px; align-items:center;">
        <button class="btn" id="btnRefreshNotes" title="بازآوری" aria-label="بازآوری" style="padding:6px 10px;">↻</button>
        <button class="btn" id="btnNewNote" title="یادداشت جدید" aria-label="یادداشت جدید" style="padding:6px 10px;">➕</button>
      </div>
    </summary>

    <div style="display:grid; gap:10px; grid-template-columns: 1fr; padding:8px 6px;">
      <input id="notesSearch" class="btn" style="padding:8px 10px; border-radius:10px;" placeholder="جستجو در یادداشت‌ها..." aria-label="جستجو در یادداشت‌ها" />

      <div id="notesList" style="display:grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap:8px; max-height:32vh; overflow:auto; padding:2px;">
        <!-- ردیف‌های یادداشت از اسکریپت صفحه اضافه می‌شوند -->
      </div>
      <div id="notesEmpty" class="muted" style="display:none; font-size:12px; text-align:center; padding:10px; border:1px dashed var(--border); border-radius:10px;">یادداشتی وجود ندارد. با «یادداشت جدید» بسازید.</div>

      <div style="display:grid; gap:8px; grid-template-columns: 1fr; background: var(--panel); border:1px solid var(--border); border-radius:12px; padding:10px;">
        <input id="noteTitle" placeholder="عنوان یادداشت" class="btn" style="padding:8px 10px; border-radius:10px;" aria-label="عنوان یادداشت" />
        <textarea id="notesArea" placeholder="متن یادداشت..." style="min-height:140px; padding:10px; border-radius:10px; border:1px solid var(--border); background:#0b1220; color:var(--text);" aria-label="متن یادداشت"></textarea>
        <div style="display:flex; gap:8px; align-items:center; justify-content:flex-end;">
          <span class="muted" id="notesSaveStatus" style="font-size:11px; margin-inline-end:auto"></span>
          <button class="send" id="btnSaveCurrentNote" title="ذخیره" aria-label="ذخیره یادداشت" style="padding:10px 12px;">ذخیره</button>
        </div>
      </div>
    </div>
  </details>
</aside>


<script>
  (function(){
    // auto refresh
    let notesAutoTimer = null;
    function startNotesAuto(){
      if(notesAutoTimer) clearInterval(notesAutoTimer);
      notesAutoTimer = setInterval(()=>{
        try{
          if(typeof refreshNotesList === 'function'){ refreshNotesList(); toggleEmptyState(); }
        }catch(e){}
      }, 10000);
    }
    document.addEventListener('visibilitychange', ()=>{ if(!document.hidden){ startNotesAuto(); } });

    // search filter
    const search = document.getElementById('notesSearch');
    function filterNotes(){
      try{
        const q = (search.value||'').trim();
        const list = document.getElementById('notesList');
        Array.from(list.children||[]).forEach(row=>{
          const text = (row.textContent||'').trim();
          row.style.display = (!q || text.includes(q)) ? '' : 'none';
        });
      }catch(e){}
    }
    search?.addEventListener('input', filterNotes);

    // empty state toggler
    function toggleEmptyState(){
      const list = document.getElementById('notesList');
      const empty = document.getElementById('notesEmpty');
      if(!list || !empty) return;
      const hasAny = Array.from(list.children||[]).some(el=> el.style.display !== 'none');
      empty.style.display = hasAny ? 'none' : '';
    }

    // char count
    const area = document.getElementById('notesArea');
    const count = document.getElementById('notesCount');
    function updateCount(){ try{ count.textContent = (area.value||'').length + ' کاراکتر'; }catch(e){} }
    area?.addEventListener('input', updateCount);

    // init
    startNotesAuto();
    setTimeout(()=>{ toggleEmptyState(); updateCount(); }, 0);
  })();
  </script>
