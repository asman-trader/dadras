<div id="sideOverlay" class="side-overlay" hidden style="cursor:pointer" onclick="document.getElementById('sideDrawer').classList.remove('open'); document.getElementById('sideOverlay').hidden = true; document.body.style.overflow = ''; document.querySelector('header').style.opacity = '1'; document.querySelector('main').style.opacity = '1'; document.querySelector('footer').style.opacity = '1'; const composer = document.querySelector('.composer'); if(composer) composer.style.opacity = '1';"></div>
<nav id="sideDrawer" class="side-drawer" aria-hidden="true">
  <style>
    #sideDrawer .brand { display:flex; align-items:center; gap:8px; padding:12px }
    #sideDrawer .brand .logo { width:22px; height:22px; border-radius:50%; background:#3b82f6; box-shadow:0 0 10px #3b82f6 }
    #sideDrawer .brand h2 { margin:0; font-size:18px; color:#60a5fa; letter-spacing:.3px }
    #sideDrawer .newchat-btn { width:100%; display:flex; align-items:center; gap:10px; padding:12px 14px; border-radius:16px; border:1px solid var(--border); background:#111827; color:var(--text); cursor:pointer }
    #sideDrawer .newchat-btn:hover { border-color:#2a3b4f }
    #sideDrawer .section { padding:10px 12px; color:#94a3b8; font-size:12px }
    #sideDrawer #chatList .btn { justify-content:space-between; text-align:right; background:#111827; border:1px solid var(--border); border-radius:14px; padding:12px 14px }
    #sideDrawer #chatList .btn:hover { border-color:#2a3b4f }
    #sideDrawer #chatList .more { opacity:.6 }
    #sideDrawer .chat-scrollable { flex:1; display:flex; flex-direction:column; overflow:hidden }
    #sideDrawer #chatList { flex:1; overflow:auto; scrollbar-width:none; -ms-overflow-style:none }
    #sideDrawer #chatList::-webkit-scrollbar { display:none }
    #sideDrawer .profile-card { display:flex; align-items:center; gap:10px; padding:10px 12px; background:#0b1220; border:1px solid var(--border); border-radius:14px; margin:12px 12px 10px }
    #sideDrawer .profile-card .avatar { width:36px; height:36px; border-radius:50%; background:linear-gradient(135deg,#3b82f6,#22c55e); display:flex; align-items:center; justify-content:center; font-weight:700; color:#05101c }
    #sideDrawer .profile-card .profile-meta { display:flex; flex-direction:column; line-height:1.3 }
    #sideDrawer .profile-card .profile-name { font-size:14px }
    #sideDrawer .profile-card .profile-sub { font-size:12px; color:#94a3b8 }
    #sideDrawer .profile-card:hover { border-color:#2a3b4f }
  </style>

  <div class="brand">
    <div class="logo"></div>
    <h2>dadras</h2>
    <button class="btn" id="sideClose" aria-label="بستن" style="margin-inline-start:auto">×</button>
  </div>

  <div style="padding:0 12px;">
    <button class="newchat-btn" id="btnNewChat">
      <span style="font-size:18px">＋</span>
      <span>گفت‌وگوی جدید</span>
    </button>
  </div>
  <!-- top links removed to avoid duplication with profile card -->
  <div class="chat-scrollable">
    <div id="chatList" style="margin:0 12px 6px; display:flex; flex-direction:column; gap:12px;"></div>
  </div>
  <!-- draft generator removed; drafting happens via chat now -->
  <div style="padding:12px; border-top:1px solid var(--border)">
    {% if current_user %}
    {% set phone_local = ('0' ~ current_user.phone_norm[2:]) if current_user.phone_norm and current_user.phone_norm.startswith('98') else current_user.phone_norm %}
    <a class="profile-card" href="/auth/profile" style="text-decoration:none; color:inherit;">
      <div class="avatar">👤</div>
      <div class="profile-meta">
        <div class="profile-name">پروفایل</div>
        <div class="profile-sub">{{ phone_local }}</div>
      </div>
    </a>
    {% else %}
    <a class="profile-card" href="/auth/login" style="text-decoration:none; color:inherit;">
      <div class="avatar">👤</div>
      <div class="profile-meta">
        <div class="profile-name">مهمان</div>
        <div class="profile-sub">برای ورود، کلیک کنید</div>
      </div>
    </a>
    {% endif %}
  </div>
</nav>
