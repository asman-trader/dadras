<footer class="panel" style="margin:0; padding:0; background:transparent; border:0;"></footer>

<div class="composer">
  <div class="bar">
    <!-- Thinking Indicator (shown during processing) -->
    <div class="thinking-indicator" id="thinkingIndicator" style="display:none;">
      <span id="thinkingTimer">⏳ در حال فکر کردن... <span id="thinkingSeconds">0</span>s</span>
    </div>
    
    <!-- Input Row -->
    <div class="input-row">
      <div id="inputWrap" class="input-wrap">
        <textarea id="q" placeholder="سؤال خود را بنویسید... (Shift+Enter برای خط جدید)" aria-label="ورود متن"></textarea>
        <button class="send send-btn" id="sendBtn" aria-label="ارسال پیام" title="ارسال">
          <span id="sendIcon" aria-hidden="true">➤</span>
        </button>
        <div class="deepthink-toggle">
          <button type="button" id="deepThinkBtn" class="deepthink-pill-btn" aria-pressed="false" title="فکر عمیق ۶۰ ثانیه">
            <span class="pill-text">فکر عمیق</span>
          </button>
        </div>
      </div>
      <div class="composer-actions"></div>
    </div>
  </div>
</div>

<style>
  .composer {
    backdrop-filter: blur(6px);
    padding: 16px;
    padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px));
    background: linear-gradient(180deg, rgba(15,20,27,0.85), rgba(11,15,20,0.92));
    border-top: 1px solid var(--border);
    box-shadow: 0 -6px 18px rgba(0,0,0,0.25);
  }

  .composer .bar {
    width: 100%;
    max-width: 960px;
    margin: 0 auto;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .thinking-indicator {
    padding: 8px 12px;
    background: #0f141b;
    border: 1px solid #3b82f6;
    border-radius: 8px;
    font-size: 12px;
    color: #3b82f6;
    animation: pulse 2s infinite;
  }

  .input-row {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: flex-end;
    width: 100%;
  }

  .input-wrap {
    display: flex;
    align-items: center;
    gap: 8px;
    flex: 1 1 220px;
    min-width: 0;
    background: #0b1220;
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 10px 12px;
    position: relative;
  }
  .deepthink-toggle {
    position: absolute;
    inset-block-start: 8px;
    inset-inline-end: 12px;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    color: var(--text);
    font-size: 12px;
    background: rgba(30,41,59,0.35);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 4px 8px;
  }
  .deepthink-toggle .deepthink-pill-btn { display:inline-flex; align-items:center; gap:8px; background: rgba(17,24,39,.45); color:#e5e7eb; border:1px solid rgba(148,163,184,.35); border-radius:999px; padding:6px 12px; cursor:pointer; transition: all .2s ease; box-shadow: none; }
  .deepthink-toggle .deepthink-pill-btn:hover { border-color: rgba(203,213,225,.6); }
  .deepthink-toggle .deepthink-pill-btn.on { background: rgba(17,24,39,.6); color:#93c5fd; border-color: rgba(59,130,246,.9); box-shadow: 0 0 0 1px rgba(59,130,246,.6) inset; }
  .deepthink-toggle .pill-text { user-select:none; font-size:12px; font-weight:600; letter-spacing:.2px; }

  /* attach button removed */

  #q {
    flex: 1;
    background: transparent;
    border: 0;
    outline: 0;
    resize: none;
    min-height: 28px;
    max-height: 180px;
    color: var(--text);
    font-size: 14px;
    line-height: 1.6;
    padding-inline-start: 48px; /* space for send button inside */
    overflow-y: auto;
  }

  .composer-actions { display:flex; flex-wrap:wrap; gap:8px; align-items:center; justify-content:flex-end; }

  .send-btn {
    position: absolute;
    inset-inline-start: 8px;
    inset-block-end: 8px;
    width: 36px;
    height: 36px;
    padding: 0;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border-radius: 999px;
    box-shadow: 0 6px 14px rgba(34,197,94,0.2);
  }

  .input-wrap:focus-within {
    border-color: rgba(34,197,94,.45);
    box-shadow: 0 0 0 3px rgba(34,197,94,.15);
  }
  
  @media (max-width: 480px) { }

  @media (max-width: 480px) { .composer-actions{ width:100%; justify-content: space-between; } .send-btn{ flex:1 1 140px; } }
  
  @keyframes pulse {
    0%, 100% { opacity: 0.6; }
    50% { opacity: 1; }
  }
</style>

<script>
  (function(){
    const btn = document.getElementById('deepThinkBtn');
    if(!btn) return;
    function apply(){
      const on = btn.classList.toggle('on');
      btn.setAttribute('aria-pressed', on ? 'true' : 'false');
      try{ window.dispatchEvent(new CustomEvent('thinkingTimeChanged', { detail: { thinkingTime: on ? 60 : 0 } })); }catch(e){}
    }
    btn.addEventListener('click', apply);
  })();
</script>
