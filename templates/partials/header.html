<header>
  <div class="header-container">
    <style>
      header {
        background: transparent;
        border-bottom: 1px solid rgba(34,197,94,.15);
        box-shadow: none;
      }
      
      header .header-container {
        max-width: 1400px;
        margin: 0 auto;
        padding: 0 16px;
      }
      
      /* Top Row */
      header .top-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 16px 0;
      }
      
      header .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 6px 12px;
        border-radius: 12px;
        background: linear-gradient(135deg, rgba(34,197,94,.1) 0%, rgba(16,185,129,.05) 100%);
        border: 1px solid rgba(34,197,94,.2);
        transition: all 0.3s;
      }
      
      header .brand:hover {
        background: linear-gradient(135deg, rgba(34,197,94,.15) 0%, rgba(16,185,129,.08) 100%);
        border-color: rgba(34,197,94,.3);
        box-shadow: 0 4px 12px rgba(34,197,94,.2);
      }
      
      header .brand .logo {
        width: 28px;
        height: 28px;
        border-radius: 8px;
        background: linear-gradient(135deg, #22c55e 0%, #16a34a 100%);
        box-shadow: 0 0 20px rgba(34,197,94,.4), inset 0 1px 2px rgba(255,255,255,.3);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 16px;
        animation: glow 3s ease-in-out infinite;
      }
      
      @keyframes glow {
        0%, 100% { box-shadow: 0 0 20px rgba(34,197,94,.4), inset 0 1px 2px rgba(255,255,255,.3); }
        50% { box-shadow: 0 0 30px rgba(34,197,94,.6), inset 0 1px 2px rgba(255,255,255,.3); }
      }
      
      header .brand h2 {
        margin: 0;
        font-size: 20px;
        font-weight: 700;
        background: linear-gradient(135deg, #22c55e 0%, #10b981 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        letter-spacing: 0.5px;
      }
      
      header .top-actions {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      
      header .action-btn {
        width: 40px;
        height: 40px;
        display: flex;
        align-items: center;
        justify-content: center;
        border: 1px solid rgba(100,116,139,.3);
        border-radius: 10px;
        background: rgba(15,23,42,.8);
        color: #e2e8f0;
        cursor: pointer;
        transition: all 0.3s;
        font-size: 18px;
        position: relative;
      }
      
      header .action-btn:hover {
        border-color: #22c55e;
        background: rgba(34,197,94,.1);
        transform: translateY(-2px);
        box-shadow: 0 4px 12px rgba(34,197,94,.2);
      }
      
      header .action-btn .badge {
        position: absolute;
        top: -4px;
        right: -4px;
        background: linear-gradient(135deg, #22c55e 0%, #16a34a 100%);
        color: #000;
        font-size: 10px;
        padding: 2px 6px;
        border-radius: 10px;
        font-weight: 700;
        box-shadow: 0 2px 8px rgba(34,197,94,.4);
      }
      
      /* Role Selector Dropdown */
      header .role-selector {
        position: relative;
        margin-right: 12px;
      }
      
      header .role-trigger {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 6px 12px;
        background: rgba(34,197,94,.08);
        border: 1px solid rgba(34,197,94,.25);
        border-radius: 10px;
        cursor: pointer;
        transition: all 0.3s;
        font-size: 13px;
        font-weight: 600;
        color: #22c55e;
      }
      
      header .role-trigger:hover {
        background: rgba(34,197,94,.15);
        border-color: rgba(34,197,94,.4);
        box-shadow: 0 2px 8px rgba(34,197,94,.2);
      }
      
      header .role-trigger .icon {
        font-size: 16px;
      }
      
      header .role-trigger .arrow {
        font-size: 10px;
        transition: transform 0.3s;
      }
      
      header .role-selector.open .role-trigger .arrow {
        transform: rotate(180deg);
      }
      
      header .role-dropdown {
        position: absolute;
        top: calc(100% + 8px);
        left: 0;
        background: rgba(15,20,27,.98);
        border: 1px solid rgba(34,197,94,.3);
        border-radius: 12px;
        box-shadow: 0 8px 24px rgba(0,0,0,.4), 0 0 40px rgba(34,197,94,.15);
        padding: 6px;
        min-width: 180px;
        opacity: 0;
        visibility: hidden;
        transform: translateY(-10px);
        transition: all 0.3s;
        z-index: 1000;
      }
      
      header .role-selector.open .role-dropdown {
        opacity: 1;
        visibility: visible;
        transform: translateY(0);
      }
      
      header .role-option {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px 12px;
        border-radius: 8px;
        cursor: pointer;
        transition: all 0.2s;
        color: #94a3b8;
        font-size: 13px;
        font-weight: 600;
      }
      
      header .role-option:hover {
        background: rgba(34,197,94,.1);
        color: #22c55e;
      }
      
      header .role-option.active {
        background: linear-gradient(135deg, rgba(34,197,94,.2) 0%, rgba(16,185,129,.15) 100%);
        color: #22c55e;
        border: 1px solid rgba(34,197,94,.3);
      }
      
      header .role-option .icon {
        font-size: 18px;
      }
      
      header .role-option .check {
        margin-right: auto;
        font-size: 14px;
        opacity: 0;
      }
      
      header .role-option.active .check {
        opacity: 1;
      }
      
      header .role-option.disabled {
        opacity: 0.5;
        cursor: not-allowed;
        position: relative;
      }
      
      header .role-option.disabled:hover {
        background: transparent;
        color: #94a3b8;
      }
      
      header .role-option.disabled::after {
        content: '🔒';
        position: absolute;
        left: 12px;
        font-size: 12px;
      }
      
      /* Responsive */
      @media (max-width: 768px) {
        header .brand {
          padding: 4px 8px;
        }
        
        header .brand .logo {
          width: 24px;
          height: 24px;
          font-size: 14px;
        }
        
        header .brand h2 {
          font-size: 16px;
        }
        
        header .role-trigger {
          padding: 4px 10px;
          font-size: 12px;
        }
        
        header .role-trigger .icon {
          font-size: 14px;
        }
        
        header .action-btn {
          width: 36px;
          height: 36px;
          font-size: 16px;
        }
      }
      
      @media (min-width: 960px) {
        body.sidebar-collapsed .side-drawer {
          transform: translateX(-100%);
        }
      }
    </style>
    
    <!-- Header Row -->
    <div class="top-row">
      <div style="display:flex; align-items:center; gap:0;">
        <div class="brand">
          <div class="logo">⚖️</div>
          <h2>دادرس</h2>
        </div>
        
        <!-- Role Selector Dropdown -->
        <div class="role-selector" id="roleSelector">
          <div class="role-trigger" id="roleTrigger">
            <span class="icon" id="currentRoleIcon">👤</span>
            <span id="currentRoleText">دستیار شهروند</span>
            <span class="arrow">▼</span>
          </div>
          
          <div class="role-dropdown">
            <div class="role-option active" data-role="default">
              <span class="icon">👤</span>
              <span>دستیار شهروند</span>
              <span class="check">✓</span>
            </div>
            <div class="role-option disabled" data-role="lawyer">
              <span class="icon">⚖️</span>
              <span>دستیار وکیل</span>
              <span class="check">✓</span>
            </div>
            <div class="role-option disabled" data-role="judge">
              <span class="icon">👨‍⚖️</span>
              <span>دستیار قاضی</span>
              <span class="check">✓</span>
            </div>
          </div>
        </div>
      </div>
      
      <div class="top-actions">
        <button class="action-btn" id="analyticsBtn" aria-label="آمار مکالمه" title="نمایش آمار و تحلیل مکالمه">
          📊
          <span id="analyticsBadge" class="badge" style="display:none"></span>
        </button>
        
        <button class="action-btn" id="notesBtn" aria-label="یادداشت‌ها" title="باز کردن یادداشت‌ها">
          📝
          <span id="notesBadge" class="badge" style="display:none">0</span>
        </button>
        
        <button class="action-btn" id="hamBtn" aria-label="منو" title="باز کردن منو">
          ☰
        </button>
      </div>
    </div>
  </div>
  <script>
    // Role Selector Dropdown
    (function(){
      const roleSelector = document.getElementById('roleSelector');
      const roleTrigger = document.getElementById('roleTrigger');
      const roleOptions = document.querySelectorAll('.role-option');
      const currentRoleIcon = document.getElementById('currentRoleIcon');
      const currentRoleText = document.getElementById('currentRoleText');
      
      // Toggle dropdown
      roleTrigger?.addEventListener('click', (e)=>{
        e.stopPropagation();
        roleSelector.classList.toggle('open');
      });
      
      // Close on outside click
      document.addEventListener('click', (e)=>{
        if(!roleSelector?.contains(e.target)){
          roleSelector?.classList.remove('open');
        }
      });
      
      // Handle role selection
      roleOptions.forEach(option=>{
        option.addEventListener('click', ()=>{
          // بررسی اگر گزینه disabled است
          if(option.classList.contains('disabled')){
            // نمایش اخطار
            const text = option.querySelector('span:nth-child(2)').textContent;
            
            // ایجاد toast notification
            const toast = document.createElement('div');
            toast.style.cssText = `
              position: fixed;
              top: 50%;
              left: 50%;
              transform: translate(-50%, -50%);
              background: linear-gradient(135deg, rgba(251,146,60,.95) 0%, rgba(249,115,22,.95) 100%);
              color: #fff;
              padding: 20px 32px;
              border-radius: 16px;
              border: 2px solid rgba(251,146,60,.5);
              box-shadow: 0 8px 32px rgba(0,0,0,.4), 0 0 60px rgba(251,146,60,.3);
              z-index: 10000;
              font-size: 16px;
              font-weight: 600;
              text-align: center;
              animation: scaleIn 0.3s ease-out;
              min-width: 300px;
            `;
            
            toast.innerHTML = `
              <div style="font-size: 32px; margin-bottom: 12px;">⚠️</div>
              <div style="margin-bottom: 8px;">${text}</div>
              <div style="font-size: 13px; opacity: 0.9; font-weight: 500;">در حال توسعه - به زودی...</div>
            `;
            
            document.body.appendChild(toast);
            
            // اضافه کردن animation
            const style = document.createElement('style');
            style.textContent = `
              @keyframes scaleIn {
                from { opacity: 0; transform: translate(-50%, -50%) scale(0.8); }
                to { opacity: 1; transform: translate(-50%, -50%) scale(1); }
              }
              @keyframes scaleOut {
                from { opacity: 1; transform: translate(-50%, -50%) scale(1); }
                to { opacity: 0; transform: translate(-50%, -50%) scale(0.8); }
              }
            `;
            document.head.appendChild(style);
            
            // حذف toast بعد از 3 ثانیه
            setTimeout(()=>{
              toast.style.animation = 'scaleOut 0.3s ease-out';
              setTimeout(()=>toast.remove(), 300);
            }, 3000);
            
            // بستن dropdown
            roleSelector.classList.remove('open');
            return;
          }
          
          const role = option.dataset.role;
          const icon = option.querySelector('.icon').textContent;
          const text = option.querySelector('span:nth-child(2)').textContent;
          
          // Update UI
          roleOptions.forEach(opt=>opt.classList.remove('active'));
          option.classList.add('active');
          currentRoleIcon.textContent = icon;
          currentRoleText.textContent = text;
          
          // Close dropdown
          roleSelector.classList.remove('open');
          
          // Trigger the role change event (will be caught by index.html)
          window.dispatchEvent(new CustomEvent('roleChanged', { detail: { role } }));
        });
      });
    })();
    
    // GPT-style toggle sidebar: click avatar (ham) toggles drawer; Esc closes
    (function(){
      const ham = document.getElementById('hamBtn');
      const drawer = document.getElementById('sideDrawer');
      const overlay = document.getElementById('sideOverlay');
      function open(){ drawer.classList.add('open'); overlay.hidden=false; drawer.setAttribute('aria-hidden','false'); }
      function close(){ drawer.classList.remove('open'); overlay.hidden=true; drawer.setAttribute('aria-hidden','true'); }
      ham?.addEventListener('click', ()=>{ if(drawer.classList.contains('open')) close(); else open(); });
      overlay?.addEventListener('click', close);
      document.getElementById('sideClose')?.addEventListener('click', close);
      document.addEventListener('keydown', (ev)=>{ if(ev.key==='Escape'){ close(); }});
    })();
  </script>
</header>
