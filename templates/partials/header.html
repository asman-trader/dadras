<header>
  <div class="header-container">
    <style>
      header {
        background: transparent;
        border-bottom: 0;
        box-shadow: none;
      }
      
      header .header-container {
        width: 100%;
        max-width: 960px;
        margin: 0 auto;
        padding: 0 16px;
      }
      
      /* Top Row */
      header .top-row {
        display: grid;
        grid-template-columns: 1fr auto 1fr;
        align-items: center;
        gap: 8px;
        padding: 16px 0;
      }
      
      header .brand-wrap { display: contents; }
      
      header .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 6px 12px;
        border-radius: 12px;
        background: transparent;
        border: 0;
        transition: all 0.3s;
        justify-content: center;
        grid-column: 2;
      }
      
      header .brand:hover {
        background: transparent;
        border-color: transparent;
        box-shadow: none;
      }
      
      header .brand .logo {
        width: 28px;
        height: 28px;
        border-radius: 8px;
        background: transparent;
        box-shadow: none;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 16px;
        animation: none;
      }
      
      @keyframes glow {
        0%, 100% { box-shadow: 0 0 20px rgba(34,197,94,.4), inset 0 1px 2px rgba(255,255,255,.3); }
        50% { box-shadow: 0 0 30px rgba(34,197,94,.6), inset 0 1px 2px rgba(255,255,255,.3); }
      }
      
      header .brand h2 {
        margin: 0;
        font-size: 20px;
        font-weight: 700;
        background: linear-gradient(135deg, #22c55e 0%, #10b981 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        letter-spacing: 0.5px;
      }
      
      header .header-right,
      header .header-left {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      header .header-right { grid-column: 1; justify-self: start; }
      header .header-left { grid-column: 3; justify-self: end; }
      
      header .action-btn {
        width: 40px;
        height: 40px;
        display: flex;
        align-items: center;
        justify-content: center;
        border: 1px solid rgba(100,116,139,.3);
        border-radius: 10px;
        background: rgba(15,23,42,.8);
        color: #e2e8f0;
        cursor: pointer;
        transition: all 0.3s;
        font-size: 18px;
        position: relative;
      }
      
      header .action-btn:hover {
        border-color: #22c55e;
        background: rgba(34,197,94,.1);
        transform: translateY(-2px);
        box-shadow: 0 4px 12px rgba(34,197,94,.2);
      }
      
      header .action-btn .badge {
        position: absolute;
        top: -4px;
        right: -4px;
        background: linear-gradient(135deg, #22c55e 0%, #16a34a 100%);
        color: #000;
        font-size: 10px;
        padding: 2px 6px;
        border-radius: 10px;
        font-weight: 700;
        box-shadow: 0 2px 8px rgba(34,197,94,.4);
      }
      
      /* Responsive */

      @media (min-width: 640px) {
        header .top-row {
          flex-direction: row;
          gap: 16px;
          align-items: center;
        }
        header .brand-wrap {
          flex-direction: row;
          align-items: center;
          gap: 16px;
          width: auto;
        }
        header .brand {
          width: auto;
        }
        header .role-selector {
          width: auto;
          margin-right: 12px;
        }
        header .role-trigger {
          width: auto;
          justify-content: flex-start;
        }
        header .top-actions {
          width: auto;
        }
      }

      @media (min-width: 960px) {
        body.sidebar-collapsed .side-drawer {
          transform: translateX(-100%);
        }
      }
    </style>
    
    <!-- Header Row -->
    <div class="top-row">
      <div class="header-right">
        <button class="action-btn" id="notesBtn" aria-label="یادداشت‌ها" title="باز کردن یادداشت‌ها">
          📝
          <span id="notesBadge" class="badge" style="display:none">0</span>
        </button>
      </div>
      <div class="brand-wrap">
        <div class="brand">
          <div class="logo" title="قوه قضائیه" aria-label="قوه قضائیه">⚖️</div>
        </div>
      </div>
      <div class="header-left">
        <button class="action-btn" id="hamBtn" aria-label="منو" title="باز کردن منو">
          ☰
        </button>
      </div>
    </div>
  </div>
  <script>
    // GPT-style toggle sidebar: click avatar (ham) toggles drawer; Esc closes
    (function(){
      const ham = document.getElementById('hamBtn');
      const drawer = document.getElementById('sideDrawer');
      const overlay = document.getElementById('sideOverlay');
      function open(){ drawer.classList.add('open'); overlay.hidden=false; drawer.setAttribute('aria-hidden','false'); }
      function close(){ drawer.classList.remove('open'); overlay.hidden=true; drawer.setAttribute('aria-hidden','true'); }
      ham?.addEventListener('click', ()=>{ if(drawer.classList.contains('open')) close(); else open(); });
      overlay?.addEventListener('click', close);
      document.getElementById('sideClose')?.addEventListener('click', close);
      document.addEventListener('keydown', (ev)=>{ if(ev.key==='Escape'){ close(); }});
    })();
  </script>
</header>
