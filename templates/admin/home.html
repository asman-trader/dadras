<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>پنل ادمین - خانه</title>
  <style>
    :root {
      color-scheme: dark;
    }

    body {
      margin: 0;
      background: #0b0f14;
      color: #e2e8f0;
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
    }

    a {
      color: #93c5fd;
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    .container {
      width: 100%;
      max-width: 960px;
      margin: 0 auto;
      padding: 24px 16px 32px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .topbar {
      display: flex;
      flex-direction: column;
      gap: 12px;
      align-items: stretch;
      padding: 14px;
      background: rgba(15,20,27,.6);
      border: 1px solid #1f2937;
      border-radius: 12px;
      backdrop-filter: saturate(120%) blur(6px);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 800;
      letter-spacing: .2px;
    }

    .brand-badge {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      display: grid;
      place-items: center;
      background: #1a2230;
      border: 1px solid #243042;
      color: #93c5fd;
      font-size: 16px;
    }

    .topbar-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .grid {
      display: grid;
      gap: 14px;
      grid-template-columns: minmax(0, 1fr);
    }

    .card {
      border: 1px solid #1f2937;
      background: #0f141b;
      border-radius: 14px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .muted {
      color: #94a3b8;
      font-size: 12px;
    }

    .btn {
      padding: 10px 12px;
      border: 1px solid #1f2937;
      background: #0b1220;
      color: #e2e8f0;
      border-radius: 10px;
      cursor: pointer;
      text-align: center;
      transition: border-color 0.2s ease, transform 0.2s ease;
    }

    .btn:hover {
      border-color: #2a3b4f;
      transform: translateY(-1px);
    }

    pre {
      margin: 0;
      overflow: auto;
      padding: 12px;
      background: #0b1220;
      border: 1px solid #1f2937;
      border-radius: 12px;
      direction: ltr;
      text-align: left;
    }

    @media (min-width: 640px) {
      .topbar {
        flex-direction: row;
        align-items: center;
      }

      .grid {
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="topbar">
      <div class="brand"><div class="brand-badge">د</div><div>پنل ادمین</div></div>
      <div class="topbar-actions"><a href="/" class="btn">خانه</a><a href="/auth/profile" class="btn">پروفایل</a></div>
    </div>
    <div class="grid">
      <a class="card" href="/admin/llm">
        <div style="font-weight:700">مدل‌های هوش</div>
        <div class="muted">پیکربندی DeepSeek و Ollama، بررسی اتصال</div>
        <div class="btn">باز کردن</div>
      </a>
      <a class="card" href="/admin/data">
        <div style="font-weight:700">داده‌ها</div>
        <div class="muted">مدیریت فایل‌های ورودی و قالب‌ها</div>
        <div class="btn">باز کردن</div>
      </a>
      <a class="card" href="/admin/logs/view">
        <div style="font-weight:700">لاگ‌ها</div>
        <div class="muted">مشاهده رویدادها و خطاها</div>
        <div class="btn">باز کردن</div>
      </a>
      <a class="card" href="/admin/payments">
        <div style="font-weight:700">پرداخت</div>
        <div class="muted">تنظیمات قیمت، طول اشتراک، Sandbox/Mock</div>
        <div class="btn">باز کردن</div>
      </a>
    </div>
    <div class="card">
      <div style="font-weight:700">آمار سریع</div>
      <pre id="statOut" style="max-height:220px"></pre>
    </div>
  </div>

  <script>
    fetch('/admin/stats').then(r=>r.json()).then(j=>{
      document.getElementById('statOut').textContent = JSON.stringify(j, null, 2);
    }).catch(()=>{});
  </script>
</body>
</html>
