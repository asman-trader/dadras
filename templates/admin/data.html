<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>مدیریت داده - ادمین</title>
  <style>
    body {
      margin: 0;
      background: #0b0f14;
      color: #e2e8f0;
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }

    a {
      color: #93c5fd;
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    .page {
      width: 100%;
      max-width: 960px;
      margin: 0 auto;
      padding: 24px 16px 32px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .muted {
      color: #94a3b8;
    }

    .btn {
      padding: 10px 12px;
      border: 1px solid #1f2937;
      background: #0b1220;
      color: #e2e8f0;
      border-radius: 10px;
      cursor: pointer;
      transition: border-color 0.2s ease, transform 0.2s ease;
    }

    .btn:hover {
      border-color: #2a3b4f;
      transform: translateY(-1px);
    }

    input {
      width: 100%;
      padding: 10px 12px;
      background: #0b1220;
      color: #e2e8f0;
      border: 1px solid #1f2937;
      border-radius: 10px;
      font-size: 14px;
    }

    .card {
      border: 1px solid #1f2937;
      background: #0f141b;
      border-radius: 14px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .card h2 {
      font-size: 16px;
      margin: 0;
    }

    .action-row {
      display: flex;
      flex-direction: column;
      gap: 8px;
      align-items: stretch;
    }

    .action-row-inline {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }

    pre {
      margin: 0;
      max-height: 280px;
      overflow: auto;
      padding: 12px;
      background: #0b1220;
      border: 1px solid #1f2937;
      border-radius: 12px;
      direction: ltr;
      text-align: left;
      font-size: 13px;
    }

    label input[type="checkbox"] {
      margin-left: 6px;
      accent-color: #22c55e;
    }

    @media (min-width: 640px) {
      .action-row {
        flex-direction: row;
        align-items: center;
        gap: 12px;
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <p><a href="/admin">بازگشت</a></p>
    <h1 style="font-size:18px; margin:0;">مدیریت داده‌ها</h1>

    <div class="card">
      <h2>بارگذاری داده از مسیر محلی</h2>
      <label class="muted" for="ingDir">پوشه (پیش‌فرض: data/):</label>
      <input type="text" id="ingDir" placeholder="data">
      <div class="action-row">
        <button class="btn" id="btnIngest">ingest</button>
        <span id="ingStatus" class="muted"></span>
      </div>
      <pre id="ingOut"></pre>
    </div>

    <div class="card">
      <h2>استخراج متن از PDF و ذخیره کنار فایل</h2>
      <label class="muted" for="pdfDir">پوشه (پیش‌فرض: data/texts):</label>
      <input type="text" id="pdfDir" placeholder="data/texts">
      <div class="action-row">
        <div class="action-row-inline">
          <button class="btn" id="btnExtract">Extract PDF → TXT</button>
          <label class="muted" style="display:flex; align-items:center; gap:6px;">
            <input type="checkbox" id="pdfForce"> بازنویسی اجباری
          </label>
        </div>
        <span id="pdfStatus" class="muted"></span>
      </div>
      <pre id="pdfOut"></pre>
    </div>

    <div class="card">
      <h2>آمار</h2>
      <div class="action-row">
        <button class="btn" id="btnStats">دریافت آمار</button>
        <span id="statStatus" class="muted"></span>
      </div>
      <pre id="statOut"></pre>
    </div>
  </div>

  <script>
    const $=s=>document.querySelector(s);
    async function fetchWithAdmin(url, options){ options=options||{}; options.headers=options.headers||{}; const r=await fetch(url, options); return r }
    $('#btnIngest').addEventListener('click', async ()=>{ const d=$('#ingDir').value.trim(); const st=$('#ingStatus'); const out=$('#ingOut'); st.textContent='در حال بارگذاری...'; out.textContent=''; try{ const r=await fetchWithAdmin('/ingest',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({dir:d||undefined})}); const j=await r.json(); out.textContent=JSON.stringify(j,null,2); st.textContent='' }catch(e){ st.textContent='خطا' } });
    $('#btnExtract').addEventListener('click', async ()=>{ const d=$('#pdfDir').value.trim()||'data/texts'; const force=$('#pdfForce').checked; const st=$('#pdfStatus'); const out=$('#pdfOut'); st.textContent='در حال استخراج...'; out.textContent=''; try{ const r=await fetchWithAdmin('/admin/extract-pdf-text',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({dir:d, force:force})}); const j=await r.json(); out.textContent=JSON.stringify(j,null,2); st.textContent='' }catch(e){ st.textContent='خطا' } });
    $('#btnStats').addEventListener('click', async ()=>{ const st=$('#statStatus'); const out=$('#statOut'); st.textContent='در حال دریافت...'; out.textContent=''; try{ const r=await fetchWithAdmin('/admin/stats'); const j=await r.json(); out.textContent=JSON.stringify(j,null,2); st.textContent='' }catch(e){ st.textContent='خطا' } });
  </script>
</body>
</html>
